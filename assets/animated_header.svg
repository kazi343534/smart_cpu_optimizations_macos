<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e293b;#0f172a" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#020617">
        <animate attributeName="stop-color" values="#020617;#0f172a;#020617" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    
    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 46px;
        font-weight: 800;
        fill: url(#textGrad);
        text-anchor: middle;
        dominant-baseline: middle;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 16px;
        font-weight: 500;
        fill: #94a3b8;
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .pulse {
        animation: pulse-anim 4s ease-in-out infinite;
      }
      @keyframes pulse-anim {
        0% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.02); }
        100% { opacity: 0.8; transform: scale(1); }
      }
    </style>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bg)" rx="16" />
  
  <!-- Animated Particles -->
  <circle cx="10%" cy="80%" r="2" fill="#38bdf8">
    <animate attributeName="cy" values="80%;20%;80%" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90%" cy="30%" r="3" fill="#818cf8">
    <animate attributeName="cy" values="30%;70%;30%" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.9;0.1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="20%" cy="20%" r="1.5" fill="#34d399">
    <animate attributeName="cy" values="20%;90%;20%" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80%" cy="80%" r="2.5" fill="#38bdf8">
    <animate attributeName="cy" values="80%;10%;80%" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <g class="pulse" style="transform-origin: 50% 50%;">
    <text x="50%" y="45%" class="title">Smart Process Optimizer</text>
    <text x="50%" y="70%" class="subtitle">Live macOS Kernel Telemetry &amp; Priority Scheduling</text>
  </g>
</svg>
