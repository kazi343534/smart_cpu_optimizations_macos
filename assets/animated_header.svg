<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b">
        <animate attributeName="stop-color" values="#09090b;#18181b;#09090b" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#000000">
        <animate attributeName="stop-color" values="#000000;#09090b;#000000" dur="7s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    
    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', Roboto, Helvetica, Arial, sans-serif;
        font-size: 48px;
        font-weight: 900;
        fill: url(#textGrad);
        text-anchor: middle;
        dominant-baseline: middle;
        letter-spacing: -1px;
      }
      .subtitle {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 15px;
        font-weight: 500;
        fill: #a1a1aa;
        text-anchor: middle;
        dominant-baseline: middle;
        letter-spacing: 0.5px;
      }
      .pulse {
        animation: pulse-anim 4s ease-in-out infinite;
      }
      @keyframes pulse-anim {
        0% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.02); }
        100% { opacity: 0.85; transform: scale(1); }
      }
    </style>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bg)" rx="20" />
  
  <!-- Premium Aurora Particles -->
  <circle cx="15%" cy="80%" r="3" fill="#c084fc">
    <animate attributeName="cy" values="80%;20%;80%" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.6;0.1" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="85%" cy="30%" r="4" fill="#ec4899">
    <animate attributeName="cy" values="30%;70%;30%" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="25%" cy="25%" r="2" fill="#f43f5e">
    <animate attributeName="cy" values="25%;85%;25%" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="75%" cy="75%" r="3.5" fill="#c084fc">
    <animate attributeName="cy" values="75%;15%;75%" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <g class="pulse" style="transform-origin: 50% 50%;">
    <text x="50%" y="42%" class="title">Smart Process Optimizer</text>
    <text x="50%" y="68%" class="subtitle">Live macOS Kernel Telemetry &amp; Priority Scheduling</text>
  </g>
</svg>
