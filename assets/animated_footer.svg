<svg width="800" height="80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a1a1aa" />
      <stop offset="50%" stop-color="#f4f4f5" />
      <stop offset="100%" stop-color="#a1a1aa" />
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;200%;100%" dur="8s" repeatCount="indefinite" />
    </linearGradient>
    <style>
      .text {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', Roboto, Helvetica, Arial, sans-serif;
        font-size: 14px;
        font-weight: 500;
        fill: url(#textGrad);
        text-anchor: middle;
        dominant-baseline: middle;
        letter-spacing: 0.5px;
      }
      .heart {
        fill: #ec4899;
        transform-origin: 50% 50%;
        animation: heartbeat 1.5s infinite;
      }
      @keyframes heartbeat {
        0% { transform: scale(1); }
        15% { transform: scale(1.3); }
        30% { transform: scale(1); }
        45% { transform: scale(1.3); }
        60% { transform: scale(1); }
        100% { transform: scale(1); }
      }
    </style>
  </defs>
  
  <text x="50%" y="50%" class="text">Built with      for macOS Operating Systems Architecture.</text>
  
  <g transform="translate(352, 33)">
    <path class="heart" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
  </g>
</svg>
